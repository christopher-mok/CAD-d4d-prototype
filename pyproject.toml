[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cad_d4d"
version = "0.1.0"
description = "Design for Descent / Stochastic Rewrite Descent over watertight B-spline patch complexes"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_d4d = ["visualization/*.html", "csg/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: longer-running integration tests",
]
